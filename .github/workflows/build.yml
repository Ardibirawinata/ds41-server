name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/ds41-server"
          docker build -t "$IMG:latest" -t "$IMG:${GITHUB_SHA::7}" .
          docker push --all-tags "$IMG"

      - name: Verify arch string in built binary
        run: |
          docker run --rm --entrypoint bash "ghcr.io/${{ github.repository_owner }}/ds41-server:latest" -lc \
            'strings /usr/local/bin/llama-server | grep -x deepseek41 || (echo "arch hilang" && exit 1)'
